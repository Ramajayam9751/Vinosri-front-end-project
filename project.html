
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart Website</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <h2><span>🛍️</span> Shopping Cart</h2>
            <div class="header-cart">
                🛒 <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Products Section -->
        <section class="products-section">

            <div class="filter-box">
                <div class="search-box">
                    <input type="text" id="search"
                        placeholder="Search products...">
                    <button id="search-btn">🔍</button>
                </div>

                <div class="categories">
                    <button class="category active" data-category="All">All</button>
                    <button class="category" data-category="Electronics">Electronics</button>
                    <button class="category" data-category="Clothing">Clothing</button>
                    <button class="category" data-category="Home">Home &amp; Kitchen</button>
                    <button class="category" data-category="Beauty">Beauty</button>
                </div>
            </div>

            <div class="product-grid" id="product-list"></div>

        </section>

        <!-- Shopping Cart -->
        <aside class="cart-section">

            <div class="cart-heading">
                <h2>Your Cart</h2>
                <button id="clear-cart">Clear All</button>
            </div>

            <div id="cart-items">
                <p class="empty-cart">Your cart is empty!</p>
            </div>

            <div class="cart-summary">
                <p>
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </p>

                <p>
                    <span>Shipping:</span>
                    <span id="shipping">$0.00</span>
                </p>

                <h3>
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </h3>

                <button id="checkout">Proceed to Checkout</button>
            </div>

        </aside>
    </main>

    <script src="project.js"></script>
</body>
</html>
