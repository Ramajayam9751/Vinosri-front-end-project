<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Website</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="demo.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="logo">
            <span>🍴</span>
            <div>
                <b>My</b>
                <small>Food Corner</small>
            </div>
        </div>

        <nav>
            <a href="#">HOME</a>
            <a href="#">OUR MENU</a>
            <a href="#">BOOK A TABLE</a>
            <a href="#">ABOUT US</a>
            <a href="#">EVENTS</a>
            <a href="#">RESERVATION</a>
            <a href="#">CONTACT</a>
        </nav>

        <button class="login-btn" onclick="login()">Login</button>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">
            <p>Make Your Dinner Perfect With</p>

            <h1>Delicious Veg Cuisine</h1>

            <div class="buttons">
                <button onclick="orderNow()">Order Now</button>
                <button class="orange-btn">Book Your Table</button>
                <button class="orange-btn">View Menu</button>
            </div>
        </div>

        <div class="food-image">
            <img src="/images (1).jpg" alt="Delicious Food">
        </div>

    </section>


    <!-- Services Section -->
    <section class="services">

        <h2>We Serve</h2>
        <p>Enjoy the Best with the Choice</p>

        <div class="food-cards">

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1547592180-85f173990554?w=300" alt="Food">
                <h3>South Indian</h3>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1565299507177-b0ac66763828?w=300" alt="Food">
                <h3>Pizza</h3>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=300" alt="Food">
                <h3>Snacks</h3>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=300" alt="Food">
                <h3>Pasta</h3>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=300" alt="Food">
                <h3>Special Food</h3>
            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
